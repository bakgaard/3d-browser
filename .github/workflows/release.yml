name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: no permissions by default; granted per job below.
permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build & push ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the source to build
      packages: write # push images to GHCR
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner cross-build the linux/arm64 image for the Raspberry Pi 5.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name for GHCR compatibility.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/3d-browser-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # amd64 for local dev machines, arm64 for the Raspberry Pi 5 deployment.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write # create the release / tag notes
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container images published to GitHub Container Registry:

            - `ghcr.io/${{ github.repository_owner }}/3d-browser-backend:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/3d-browser-frontend:${{ github.ref_name }}`
